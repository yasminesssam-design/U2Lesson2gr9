<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI & Intellectual Property | الذكاء الاصطناعي وحقوق الملكية الفكرية – MOHTARF</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;font-size:22px;line-height:1.8;color:#12264a;min-height:100vh;background:linear-gradient(135deg,#dbeafe,#fef3c7,#e0e7ff,#fde68a);background-size:400% 400%;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 50%}}
header{background:#12306b;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;box-shadow:0 3px 10px #0004}
header img{width:64px;height:64px;border-radius:50%;background:#fff}
header b{font-size:26px}header small{display:block;font-size:15px;color:#fcd34d}
main{max-width:900px;margin:18px auto;padding:0 14px 60px}
.card{background:#fff;border-radius:18px;padding:18px 22px;margin:14px 0;box-shadow:0 4px 14px #0002;border-inline-start:8px solid #3b78c4;animation:pop .5s}
@keyframes pop{from{opacity:0;transform:translateY(16px)}}
.ar{font-size:26px;font-weight:bold}.en{direction:ltr;text-align:left;color:#1d4ed8;font-size:22px;margin-top:6px}
h1,h2{text-align:center;color:#12306b}h1{font-size:34px}h2{font-size:30px}
button,input{font:inherit;border-radius:14px;border:3px solid #12306b;padding:12px 22px}
button{background:#f59e0b;color:#12264a;font-weight:bold;cursor:pointer;transition:.2s}
button:hover{transform:scale(1.04);background:#fbbf24}
.big{display:block;margin:20px auto;font-size:26px}
input{width:100%;font-size:26px;text-align:center;margin:12px 0}
.opt{display:block;width:100%;text-align:start;background:#fff;margin:10px 0;font-size:24px}
.opt .en{font-size:20px;margin:0}
.opt.ok{background:#22c55e;color:#fff;border-color:#15803d;animation:jump .5s}.opt.ok .en{color:#fff}
.opt.no{background:#ef4444;color:#fff;border-color:#991b1b;animation:shake .5s}.opt.no .en{color:#fff}
@keyframes shake{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
@keyframes jump{50%{transform:scale(1.07)}}
.fb{font-size:26px;font-weight:bold;text-align:center;margin:14px 0}
.bar{height:16px;background:#cbd5e1;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#22c55e;transition:.4s}
.fx{position:fixed;top:-40px;font-size:34px;pointer-events:none;z-index:50;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.flash{position:fixed;inset:0;background:#ef4444;opacity:0;pointer-events:none;z-index:40;animation:fl .5s}
@keyframes fl{30%{opacity:.35}}
.logo{display:block;margin:10px auto;width:190px;border-radius:50%}
.tag{display:inline-block;background:#12306b;color:#fff;border-radius:20px;padding:2px 16px;font-size:20px}

body{background:linear-gradient(120deg,#c7d2fe,#bae6fd,#fde68a,#fbcfe8,#a7f3d0,#c7d2fe);background-size:500% 500%;animation:bg 16s ease infinite;overflow-x:hidden}
#bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
main{position:relative;z-index:1}
.orb{position:absolute;border-radius:50%;filter:blur(55px);opacity:.55;animation:orb 18s ease-in-out infinite alternate}
@keyframes orb{to{transform:translate(35vw,22vh) scale(1.4)}}
.fl{position:absolute;bottom:-70px;opacity:.55;animation:rise linear infinite;filter:drop-shadow(0 4px 6px #0003)}
@keyframes rise{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(35px,-30vh) rotate(25deg)}50%{transform:translate(-30px,-60vh) rotate(-20deg)}75%{transform:translate(30px,-90vh) rotate(25deg)}100%{transform:translate(0,-125vh) rotate(0)}}
.ring{position:absolute;border:4px solid #3b78c455;border-radius:50%;animation:ring 6s ease-out infinite}
@keyframes ring{from{transform:scale(.2);opacity:.9}to{transform:scale(3);opacity:0}}

{t:["حماية البيانات الشخصية","Protecting Personal Data"],p:[
["عزيزي الطالب، عندما تكتب سؤالاً أو فكرة أو تشارك قصة مع أحد تطبيقات الذكاء الاصطناعي، فقد يتم الاحتفاظ ببعض البيانات أو التعامل معها وفقاً لسياسة الخصوصية وإعدادات الخدمة المستخدمة.","Dear student, when you write a question or an idea, or share a story with an AI application, some data may be kept or handled according to the privacy policy and settings of the service."],
["لذلك يجب أن نكون حذرين عند مشاركة المعلومات، خاصةً إذا كانت تتضمن بيانات شخصية أو أفكاراً أو أعمالاً إبداعية نملك حقوقها. وعليك حماية ملكيتك الفكرية وبياناتك الشخصية.","So we must be careful when sharing information, especially personal data, ideas or creative works that we own the rights to. You must protect your intellectual property and your personal data."],
["ولحماية نفسك وأسرتك، اعتبر أن أي شيء تكتبه للذكاء الاصطناعي هو «منشور عام». تعامل بحذر ولا تشارك أي معلومات حساسة أو خاصة لا ترغب في كشفها أو استخدامها خارج نطاقك.","To protect yourself and your family, consider anything you write to AI as a “public post”. Be careful and never share sensitive or private information you do not want revealed or used outside your control."],
["🚫 <u>تجنب تماماً مشاركة الآتي:</u><br>🔹 <b>المعلومات الشخصية (PII):</b> اسمك الكامل، عنوان منزلك، رقم هاتفك، أو أي معلومة تكشف هويتك أو مكان إقامتك.<br>🔹 <b>الأسرار العائلية:</b> أي تفاصيل تخص عمل والديك أو مشاكل عائلية خاصة.<br>🔹 <b>الصور والفيديوهات الخاصة:</b> لا ترفع صورك الشخصية أو صور أصدقائك لأدوات تعديل الصور بالذكاء الاصطناعي إلا إذا كنت تثق تماماً في التطبيق، وتحقق من سياسة الخصوصية وشروط الاستخدام قبل رفع الصور.<br>🔹 <b>كلمات المرور:</b> لا تستخدم أدوات الذكاء الاصطناعي لتنظيم كلمات مرورك أو حفظها.","🚫 <u>Completely avoid sharing the following:</u><br>🔹 <b>Personally Identifiable Information (PII):</b> your full name, home address, phone number, or any information that reveals your identity or where you live.<br>🔹 <b>Family secrets:</b> any details about your parents' work or private family problems.<br>🔹 <b>Private photos and videos:</b> do not upload your personal photos or your friends' photos to AI photo-editing tools unless you completely trust the app, and check the privacy policy and terms of use before uploading.<br>🔹 <b>Passwords:</b> do not use AI tools to organize or store your passwords."]]},
{t:["حقوق الملكية الفكرية وشروط الاستخدام (TOS)","Intellectual Property Rights & Terms of Service (TOS)"],p:[
["اقرأ شروط استخدام تطبيق الذكاء الاصطناعي (Terms of Service – TOS) لمعرفة كيفية التعامل مع المحتوى الذي ترفعه أو تنشئه، ومن يملك الحقوق المتعلقة به.","Read the terms of service (TOS) of the AI application to know how the content you upload or create is handled, and who owns the rights related to it."],
["في عصر الذكاء الاصطناعي، هناك ثلاث نقاط أساسية في شروط استخدام أي تطبيق ذكاء اصطناعي مثل ChatGPT وGemini:","In the age of AI, there are three basic points in the terms of use of any AI application such as ChatGPT and Gemini:"],
["1️⃣ <b>المرحلة العمرية:</b> تأكد من أن عمرك يسمح لك باستخدام التطبيق وفقاً لشروط الخدمة والقوانين المعمول بها.","1️⃣ <b>Age group:</b> make sure your age allows you to use the application according to the terms of service and the laws in force."],
["2️⃣ <b>حماية الملكية الفكرية للمحتوى الرقمي:</b> قبل استخدام صورة أو نص أو فيديو، تأكد من حقوق استخدامه، ومن صاحب حقوق الملكية الفكرية له، وهل يسمح باستخدامه أو تعديله.","2️⃣ <b>Protecting intellectual property of digital content:</b> before using an image, text or video, check its usage rights, who owns its intellectual property, and whether using or modifying it is allowed."],
